<body data-page="contact">
<noscript><nav class="noscript-nav" aria-label="Primary"><a href="index.html">RB Productions</a><a href="films.html">Films</a><a href="about.html">About</a><a href="contact.html">Contact</a><a href="mailto:hello@rbproductions.in">hello@rbproductions.in</a></nav></noscript>
<main id="main" class="page">

  <section class="page-head">
    <p class="eyebrow">Contact</p>
    <h1 class="page-title">Tell us about<br><em>your day.</em></h1>
  </section>

  <section class="contact grid-12">
    <form class="form reveal" data-enquiry>
      <p class="eyebrow form__required">* Required</p>
      <div class="form__grid">
        <div class="field">
          <label for="f-names">Your names <span aria-hidden="true">*</span></label>
          <input id="f-names" name="names" type="text" autocomplete="name" placeholder="Aarav & Meera" required>
        </div>
        <div class="field">
          <label for="f-email">Email <span aria-hidden="true">*</span></label>
          <input id="f-email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required>
        </div>
        <div class="field">
          <label for="f-date">Date</label>
          <input id="f-date" name="date" type="date">
        </div>
        <div class="field">
          <label for="f-venue">City / venue</label>
          <input id="f-venue" name="venue" type="text" placeholder="Varanasi, Udaipur, London…">
        </div>
        <div class="field field--full">
          <label for="f-type">What are you looking for?</label>
          <select id="f-type" name="type">
            <option>Wedding film</option>
            <option>Pre-wedding film</option>
            <option>Wedding + pre-wedding</option>
            <option>Poetry / family film</option>
            <option>Commercial ad</option>
            <option>Product shoot</option>
            <option>Corporate event</option>
            <option>Something else</option>
          </select>
        </div>
        <div class="field field--full">
          <label for="f-message">Tell us a little more</label>
          <textarea id="f-message" name="message" rows="4" placeholder="How you met, how many days, what matters most to you…"></textarea>
        </div>
      </div>
      <div class="form__actions">
        <button class="btn" type="submit">Send enquiry</button>
        <p class="form__status" data-form-status role="status"></p>
      </div>
    </form>

    <aside class="contact__aside reveal">
      <div data-contact-row>
        <p class="eyebrow">Email</p>
        <a class="contact__big" data-studio-email href="#"></a>
      </div>
      <div data-contact-row>
        <p class="eyebrow">Phone</p>
        <a class="contact__big" data-studio-phone href="#"></a>
      </div>
      <div data-contact-row>
        <p class="eyebrow">WhatsApp</p>
        <a class="contact__big contact__wa" data-studio-whatsapp href="#" target="_blank" rel="noopener"></a>
      </div>
      <div data-contact-row>
        <p class="eyebrow">Studio</p>
        <address class="contact__address" data-studio-address></address>
      </div>
      <div data-contact-row>
        <p class="eyebrow">Instagram</p>
        <a class="contact__big" data-studio-instagram href="#" target="_blank" rel="noopener"></a>
      </div>
      <p class="contact__quote">Tell us the date first — it’s the one thing we can’t move.</p>
    </aside>
  </section>

</main>
